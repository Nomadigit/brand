name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build lib, assets and dist
        run: npm run build
      - name: Test (schema, transformers, contrast)
        run: npm test
      - name: Generated files are committed and fresh
        run: |
          if ! git diff --exit-code -- lib dist assets site; then
            echo "::error::Generated files are stale. Run 'npm run build' and commit lib/, dist/, assets/, site/."
            exit 1
          fi
      - name: Assemble Pages site
        run: npm run site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  pages:
    if: github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package release archives
        run: |
          (cd dist/bundle && zip -qr "$GITHUB_WORKSPACE/nomadigit-brand-web-bundle.zip" .)
          zip -qr nomadigit-brand-assets.zip assets
          zip -qr nomadigit-brand-tokens.zip tokens dist -x 'dist/bundle/*'
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            nomadigit-brand-web-bundle.zip
            nomadigit-brand-assets.zip
            nomadigit-brand-tokens.zip
